name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: dkp-pacman -Syu --noconfirm --needed deko3d uam switch-cmake switch-pkg-config

      - name: Build
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: SaltyNX-Tool
          path: SaltyNX-Tool.nro
